<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
  <title>RL Analytics — inloggen</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #06070c; color: #e8ecf2; font: 14px/1.5 system-ui, sans-serif; }
    form { width: 300px; display: grid; gap: 10px; }
    img { width: 64px; justify-self: center; margin-bottom: 4px; }
    h1 { font-size: 17px; margin: 0 0 6px; text-align: center; }
    p { margin: 0 0 6px; color: #919bad; font-size: 12.5px; text-align: center; }
    input { padding: 9px 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: inherit; font: inherit; }
    button { padding: 9px; border: 0; border-radius: 8px; background: #e8ecf2; color: #06070c; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <form id="f">
    <img src="bouw/icon.png" alt="" />
    <h1>Inloggen bij RL Analytics</h1>
    <p>Eenmalig; daarna onthoudt de app het (versleuteld op deze pc).</p>
    <input id="g" placeholder="Gebruiker" autocomplete="username" required />
    <input id="w" type="password" placeholder="Wachtwoord" autocomplete="current-password" required />
    <button>Inloggen</button>
  </form>
  <script>
    document.getElementById('f').onsubmit = (e) => {
      e.preventDefault()
      const q = new URLSearchParams({ g: document.getElementById('g').value, w: document.getElementById('w').value })
      location.href = 'rl-inloggen://?' + q
    }
  </script>
</body>
</html>
